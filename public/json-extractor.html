<!DOCTYPE html>
<html>
<head>
  <title>JSON 추출기</title>
  <script>
    // 페이지 로드 시 실행
    window.addEventListener('DOMContentLoaded', function() {
      try {
        // 페이지 본문 텍스트 추출
        const bodyText = document.body.innerText || '';

        // JSON 패턴 찾기
        if (bodyText.includes('accessToken') && bodyText.includes('refreshToken')) {
          const jsonMatch = bodyText.match(/\{[^}]*"accessToken"[^}]*\}/);
          if (jsonMatch) {
            try {
              const data = JSON.parse(jsonMatch[0]);

              // 토큰 저장
              localStorage.setItem('accessToken', data.accessToken);
              localStorage.setItem('refreshToken', data.refreshToken);
              localStorage.setItem('auth_status', data.status || 'ACTIVE');

              // 부모 창에 메시지 전송
              if (window.opener) {
                window.opener.postMessage(JSON.stringify(data), '*');
              }

              // 저장 완료 메시지 표시
              document.body.innerHTML = `
                <div style="text-align:center;padding:20px;">
                  <h3>로그인 성공!</h3>
                  <p>토큰이 저장되었습니다. 잠시 후 자동으로 이동합니다.</p>
                </div>
              `;

              // 자동으로 적절한 페이지로 이동
              setTimeout(() => {
                if (data.status === 'PENDING') {
                  window.location.href = '/onboarding/step1';
                } else {
                  window.location.href = '/home';
                }
              }, 1500);

              return;
            } catch (e) {
              document.body.innerHTML = `
                <div style="text-align:center;padding:20px;">
                  <h3>JSON 파싱 오류</h3>
                  <p>${e.message}</p>
                  <p>로그인을 다시 시도해주세요.</p>
                  <button onclick="window.location.href='/login'">로그인 페이지로 이동</button>
                </div>
              `;
            }
          } else {
            document.body.innerHTML = `
              <div style="text-align:center;padding:20px;">
                <h3>데이터 오류</h3>
                <p>JSON 데이터를 찾을 수 없습니다.</p>
                <button onclick="window.location.href='/login'">로그인 페이지로 이동</button>
              </div>
            `;
          }
        } else {
          document.body.innerHTML = `
            <div style="text-align:center;padding:20px;">
              <h3>데이터 오류</h3>
              <p>페이지에서 토큰 정보를 찾을 수 없습니다.</p>
              <button onclick="window.location.href='/login'">로그인 페이지로 이동</button>
            </div>
          `;
        }
      } catch (error) {
        document.body.innerHTML = `
          <div style="text-align:center;padding:20px;">
            <h3>오류 발생</h3>
            <p>${error.message}</p>
            <button onclick="window.location.href='/login'">로그인 페이지로 이동</button>
          </div>
        `;
      }
    });
  </script>
</head>
<body>
<div style="text-align:center;padding:20px;">
  <h3>데이터 추출 중...</h3>
  <p>잠시만 기다려주세요.</p>
</div>
</body>
</html>
